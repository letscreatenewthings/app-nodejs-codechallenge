version: "3.7"
services:
  postgres:
    image: postgres:14
    container_name: postgres_database
    restart: always
    ports:
      - "5432:5432"
    networks:
      - prisma-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transactions_db
  ms-transaction:
    build: ./transaction-ms
    container_name: transaction_ms
    ports:
      - "3000:3000"
    env_file:
      - ./transaction-ms/.env
    environment:
      DATABASE_URL: "postgresql://postgres:oscardd@postgres:5432/transactions_db?schema=public"
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: transactions_db
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKAJS_NO_PARTITIONER_WARNING: 1
      KAFKA_CLUSTERS_0_NAME: "Local Kafka"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
    depends_on:
      - postgres
      - kafka
    networks:
      - prisma-network
      - kafka-network
    command: sh -c "npm run db:deploy && npm start"

  ms-antifraud:
    build: ./antifraud-ms
    container_name: antifraud_ms
    depends_on:
      - kafka
    networks:
      - kafka-network
    environment:
      KAFKAJS_NO_PARTITIONER_WARNING: 1
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: "Local Kafka"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.8.0
    container_name: app_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - kafka-network
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    depends_on: [zookeeper]
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - kafka-network

networks:
  prisma-network:
    name: prisma-network
  kafka-network:
    name: kafka-network

volumes:
  postgres_data:   
